repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.2
    hooks:
      - id: codespell
        args: [--ignore-words-list=teh,fo]
        files: \.php$

  - repo: local
    hooks:
      - id: php-lint
        name: PHP Syntax Check
        entry: php -l
        language: system
        types: [php]

      - id: php-cs-fixer
        name: PHP CS Fixer
        entry: vendor/bin/php-cs-fixer fix --dry-run --diff
        language: system
        types: [php]

      - id: phpunit
        name: PHPUnit
        entry: vendor/bin/phpunit
        language: system
        stages: [manual]
